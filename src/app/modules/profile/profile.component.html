<div class="content">
  <div class="page-header">
    <h1 class="page-title">Mi perfil</h1>
    <p class="page-subtitle">Actualiza tu información personal</p>
  </div>

  <div class="profile-card">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="nombres">Nombres *</label>
        <input id="nombres" type="text" class="form-input" [(ngModel)]="nombres" name="nombres" required
          autocomplete="off" />
      </div>
      <div class="form-group">
        <label class="form-label" for="apellidos">Apellidos *</label>
        <input id="apellidos" type="text" class="form-input" [(ngModel)]="apellidos" name="apellidos" required
          autocomplete="off" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="dni">DNI</label>
        <input id="dni" type="text" class="form-input" [value]="dni" disabled />
      </div>
      <div class="form-group">
        <label class="form-label" for="celular">Celular *</label>
        <input id="celular" type="tel" class="form-input" [(ngModel)]="celular" name="celular" maxlength="9"
          inputmode="numeric" required autocomplete="off" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="fechaNacimiento">Fecha de nacimiento</label>
        <input id="fechaNacimiento" type="date" class="form-input" [(ngModel)]="fechaNacimiento"
          name="fechaNacimiento" />
      </div>
      <div class="form-group">
        <label class="form-label" for="zona">Zona / Congregación *</label>
        <select id="zona" class="form-input" [(ngModel)]="zona" name="zona" required>
          <option value="" disabled>Selecciona tu zona</option>
          <option *ngFor="let z of zonas" [value]="z">{{ z }}</option>
        </select>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn-secondary" type="button" (click)="volver()">Cancelar</button>
      <button class="btn-primary" type="button" [disabled]="loading || !isValid() || saving" (click)="guardar()">
        {{ saving ? 'Guardando...' : 'Guardar cambios' }}
      </button>
    </div>
  </div>
</div>
